<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card preview</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Montserrat:wght@100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <div class="card">
            <img src="images/image-product-desktop.jpg" alt="product" class="card__img">
            <div class="card__text">
                <div class="card__logo">Perfume</div>
                <h1 class="card__title">Gabrielle essence eau de parfum</h1>
                <p class="card__descr">
                    A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the
                    House of CHANEL.
                </p>
                <div class="card__price">
                    <div class="card__new-price">
                        $149.99
                    </div>
                    <div class="card__old-price">$169.99</div>
                </div>
                <button class="card__btn" type="button"><img src="images/iconcart.svg" alt="card">Add to Cart</button>
            </div>
        </div>
    </main>
</body>

</html>
